name: sim-evaluation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eval-${{ hashFiles('rl/requirements.txt') }}

      - name: Install system deps
        run: sudo apt-get install -y libosmesa6-dev libgl1 patchelf

      - name: Install Python deps
        run: pip install gymnasium gymnasium-robotics onnxruntime numpy

      - name: Run evaluation
        run: python rl/evaluate.py --success-threshold 0.4
        env:
          MUJOCO_GL: osmesa

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ github.sha }}
          path: results/latest_eval.json
