name: docker-publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push train image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/train:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/train:latest

      - name: Build and push ros2 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ros2
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ros2:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/ros2:latest
